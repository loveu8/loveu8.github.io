<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

<div class="map-chip-panel" id="mapChipPanel">
  <a class="brand-link" id="homeLink" href="../../../index.html"><span>阿星<span class="brand-en" id="brandEn"></span></span></a>
  <div class="chip-strip" id="chipStrip" role="group"></div>

    <button class="lang-toggle" type="button" data-toggle="lang">EN</button>
    <button class="theme-toggle" type="button" data-toggle="theme"></button>
  </div>
</div>

<div class="app">

    <div class="map-loading" id="mapLoading" aria-live="polite">
      <span class="map-loading-spinner"></span>
      <span id="mapLoadingText">地圖更新中</span>

    <iframe class="map-frame" id="mapFrame" title="得獎店家地圖" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <button class="map-nav-float" id="overviewBtn" type="button" hidden>🗺️ 回到全部店家</button>
  </div>

  <div class="resize-divider" id="resizeDivider"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-sticky">
      <div class="sheet-handle" id="sheetHandle">
        <div class="handle-bar"></div>
        <span class="handle-hint" id="handleHint">▲ 查看清單</span>
      </div>

      <div class="sidebar-header" id="sidebarHeader">
        <div class="sidebar-title-wrap">
          <span class="s-emoji" aria-hidden="true">🏆</span>
          <div>
            <h1 class="sidebar-name" id="pageTitle">澳洲得獎咖啡與烘焙地圖</h1>

          </div>
        </div>
        <button class="print-btn" id="printBtn" type="button">🖨️ 列印</button>
      </div>

      <div class="filters">
        <div class="filter-row">
          <span class="filter-label" id="stateLabel">州別</span>
          <button class="scroll-btn scroll-prev" type="button" data-target="stateChips" data-dir="-1">‹</button>

          <button class="scroll-btn scroll-next" type="button" data-target="stateChips" data-dir="1">›</button>
        </div>
        <div class="filter-row">
          <span class="filter-label" id="typeLabel">類型</span>
          <button class="scroll-btn scroll-prev" type="button" data-target="typeTabs" data-dir="-1">‹</button>
          <div class="filter-scroll" id="typeTabs" role="tablist" aria-labelledby="typeLabel"></div>
          <button class="scroll-btn scroll-next" type="button" data-target="typeTabs" data-dir="1">›</button>
        </div>
      </div>
      <div class="result-line" id="resultLine" aria-live="polite"></div>
    </div>

    <div class="sidebar-body" id="sidebarBody"></div>

    <button class="back-to-top" id="backToTop" type="button">↑</button>
  </aside>
